packages:
  - apps/*
  - packages/*

# Comandos (pnpm exec, pnpm run) não instalam nada sozinhos; instalação só com pnpm install.
verifyDepsBeforeRun: false

# Hoisted: uma cópia só de react e react-native para o app e os pacotes (ver docs/DECISOES.md).
nodeLinker: hoisted

# Scripts de instalação liberados um a um (pnpm 11 bloqueia por padrão).
allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  msgpackr-extract: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@expo/cli@58.1.10'
  - '@expo/metro-config@58.0.14'
  - '@expo/package-manager@1.14.2'
  - '@expo/prebuild-config@58.0.14'
  - '@expo/router-server@58.0.14'
  - babel-preset-expo@58.0.16
  - expo-asset@58.0.16
  - expo-modules-core@58.0.20
  - expo-modules-jsi@58.0.14
  - expo@58.0.12
  - react-native@0.88.0
  - expo-glass-effect@58.0.4
  - expo-router@58.0.21
  - react-native-svg@15.16.0
  - jest-expo@58.0.11
  - '@ai-sdk/gateway@4.0.115'
  - '@ai-sdk/openai-compatible@3.0.70'
  - '@ai-sdk/provider-utils@5.0.61'
  - '@ai-sdk/provider@4.0.28'
  - ai@7.0.142
